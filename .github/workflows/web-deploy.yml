name: web-deploy

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - 'VERSION'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/web/**'
      - 'packages/**'
      - '.github/workflows/web-deploy.yml'
      - 'scripts/swa-vendor-web-packages.mjs'
      - 'scripts/swa-prepare-production-package.mjs'

jobs:
  build_and_deploy_job:
    if: github.repository == 'sridharchaildn/notebook-ai'
    runs-on: ubuntu-latest
    environment: production-web
    env:
      NEXT_PUBLIC_CLOUD_API_URL: ${{ secrets.NEXT_PUBLIC_CLOUD_API_URL }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync versions
        run: npm run version:sync

      - name: Vendor workspace packages for SWA
        run: node scripts/swa-vendor-web-packages.mjs

      - name: Validate web build
        run: npm run build:web

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_YELLOW_GLACIER_0C7D3591E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: apps/web
          api_location: ''
          output_location: .next
          app_build_command: npm install --install-links=true --workspaces=false && npm run build && node ../../scripts/swa-prepare-production-package.mjs
