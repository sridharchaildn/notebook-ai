name: ci

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  javascript:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_CLOUD_API_URL: http://127.0.0.1:8790
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: public-anon-placeholder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test desktop
        run: npm run test:desktop

      - name: Build web
        run: npm run build:web

  local-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install local sidecar
        run: |
          python -m venv services/local-sidecar/.venv
          services/local-sidecar/.venv/bin/python -m pip install --upgrade pip
          services/local-sidecar/.venv/bin/python -m pip install -e './services/local-sidecar[dev]'

      - name: Test local sidecar
        working-directory: services/local-sidecar
        run: .venv/bin/python -m pytest

  cloud-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install cloud API
        run: |
          python -m venv services/cloud-api/.venv
          services/cloud-api/.venv/bin/python -m pip install --upgrade pip
          services/cloud-api/.venv/bin/python -m pip install -e './services/cloud-api[dev]'

      - name: Test cloud API
        working-directory: services/cloud-api
        run: .venv/bin/python -m pytest
