name: local-sidecar-package

on:
  push:
    branches:
      - master
    paths:
      - 'VERSION'
      - 'services/local-sidecar/**'
      - 'scripts/release/build-local-sidecar-macos.sh'
      - '.github/workflows/local-sidecar-package.yml'

jobs:
  package:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build virtualenv
        run: |
          python -m venv services/local-sidecar/.venv
          services/local-sidecar/.venv/bin/python -m pip install --upgrade pip
          services/local-sidecar/.venv/bin/python -m pip install -e './services/local-sidecar[dev]' pyinstaller

      - name: Run tests
        run: services/local-sidecar/.venv/bin/python -m pytest
        working-directory: services/local-sidecar

      - name: Package sidecar binary
        run: bash scripts/release/build-local-sidecar-macos.sh

      - uses: actions/upload-artifact@v4
        with:
          name: local-sidecar-macos
          path: dist-sidecar/**
          if-no-files-found: error
